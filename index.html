<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купи Продай</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 16px;
        }

        .search {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category {
            background: white;
            padding: 20px 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .sell {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            padding: 16px;
            background: #111;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    🛍️ Купи Продай
</header>

<div class="container">

    <input
        class="search"
        type="text"
        placeholder="🔍 Что хотите найти?"
    >

    <h2>Категории</h2>

    <div class="categories">

        <div class="category">📱 Электроника</div>
        <div class="category">🚗 Авто</div>
        <div class="category">👕 Одежда</div>
        <div class="category">🏠 Дом</div>
        <div class="category">🎮 Игры</div>
        <div class="category">📦 Другое</div>

    </div>

</div>

<button class="sell">
    ＋ Продать товар
</button>

</body>
</html>
