<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Купи Продай</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #202020;
            color: white;
            font-family: Arial, sans-serif;
        }


        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        #mainScreen {
            min-height: 100vh;
            padding-bottom: 100px;
        }


        /* ШАПКА */

        .header {
            background: #111111;
            padding: 24px 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }


        /* ПОИСК */

        .search {
            margin: 36px 20px;

            background: #3b3b3b;

            border-radius: 22px;

            padding: 20px;

            color: #999;

            font-size: 20px;

            white-space: nowrap;

            overflow: hidden;
        }


        /* ЗАГОЛОВОК */

        .title {
            margin: 0 20px 22px;

            font-size: 30px;

            font-weight: 700;
        }


        /* КАТЕГОРИИ */

        .categories {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 16px;

            padding: 0 20px;
        }


        .category {

            background: #111111;

            border-radius: 22px;

            height: 108px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 10px;

            font-size: 19px;

            min-width: 0;

            overflow: hidden;
        }


        .emoji {
            margin-right: 7px;

            flex-shrink: 0;
        }


        /* КНОПКА ПРОДАТЬ */

        .sell-button {

            position: fixed;

            left: 20px;
            right: 20px;

            bottom: 20px;

            width: calc(100% - 40px);

            background: #111111;

            color: white;

            border: none;

            border-radius: 22px;

            padding: 19px;

            font-size: 22px;

            font-weight: 700;

            z-index: 100;
        }


        /* =========================
           ЭКРАН ПРОДАЖИ
        ========================= */

        #sellForm {

            display: none;

            position: fixed;

            inset: 0;

            background: #202020;

            z-index: 1000;

            overflow-y: auto;

            padding:
                20px
                20px
                40px;
        }


        /* ЗАГОЛОВОК ФОРМЫ */

        .sell-header {

            display: flex;

            align-items: center;

            margin-bottom: 25px;
        }


        .back-button {

            background: none;

            border: none;

            color: white;

            font-size: 36px;

            padding: 0 12px 0 0;
        }


        .sell-title {

            margin: 0;

            font-size: 27px;

            font-weight: 700;
        }


        /* ПОЛЯ */

        .input-field,
        .select-field,
        .textarea-field {

            width: 100%;

            padding: 17px;

            margin-bottom: 14px;

            border: none;

            border-radius: 17px;

            background: #383838;

            color: white;

            font-size: 17px;

            outline: none;
        }


        .input-field::placeholder,
        .textarea-field::placeholder {

            color: #999;
        }


        .select-field {

            appearance: auto;
        }


        .textarea-field {

            height: 130px;

            resize: none;
        }


        /* ПУБЛИКАЦИЯ */

        .publish-button {

            width: 100%;

            padding: 18px;

            margin-top: 5px;

            border: none;

            border-radius: 19px;

            background: #111111;

            color: white;

            font-size: 19px;

            font-weight: 700;
        }


        /* ЭФФЕКТ НАЖАТИЯ */

        button:active,
        .category:active {

            transform: scale(0.98);
        }


        /* =========================
           МАЛЕНЬКИЕ ЭКРАНЫ
        ========================= */

        @media (max-width: 380px) {

            .header {
                padding: 20px 16px;
            }

            .logo {
                font-size: 25px;
            }

            .search {
                margin: 28px 16px;

                padding: 18px;

                font-size: 18px;
            }

            .title {
                margin-left: 16px;
                margin-right: 16px;

                font-size: 27px;
            }

            .categories {
                padding: 0 16px;

                gap: 12px;
            }

            .category {
                height: 95px;

                font-size: 16px;

                border-radius: 18px;
            }

            .sell-button {
                left: 16px;
                right: 16px;

                width: calc(100% - 32px);

                bottom: 15px;

                padding: 17px;

                font-size: 20px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================
     ГЛАВНЫЙ ЭКРАН
===================================== -->

<div id="mainScreen">


    <div class="header">

        <div class="logo">
            🛍️ Купи Продай
        </div>

    </div>


    <div class="search">
        🔍&nbsp; Что хотите найти?
    </div>


    <div class="title">
        Категории
    </div>


    <div class="categories">


        <div class="category">
            <span class="emoji">📱</span>
            Электроника
        </div>


        <div class="category">
            <span class="emoji">🚗</span>
            Авто
        </div>


        <div class="category">
            <span class="emoji">👕</span>
            Одежда
        </div>


        <div class="category">
            <span class="emoji">🏠</span>
            Дом
        </div>


        <div class="category">
            <span class="emoji">🎮</span>
            Игры
        </div>


        <div class="category">
            <span class="emoji">📦</span>
            Другое
        </div>


    </div>


    <button
        class="sell-button"
        onclick="openSellForm()">

        ＋ Продать товар

    </button>


</div>



<!-- =====================================
     ФОРМА ПРОДАЖИ
===================================== -->

<div id="sellForm">


    <div class="sell-header">

        <button
            class="back-button"
            onclick="closeSellForm()">

            ‹

        </button>


        <h2 class="sell-title">
            Продать товар
        </h2>

    </div>



    <input
        id="productName"
        class="input-field"
        type="text"
        placeholder="Название товара"
    >



    <input
        id="productPrice"
        class="input-field"
        type="number"
        placeholder="Цена, ₽"
    >



    <select
        id="productCategory"
        class="select-field">

        <option value="">
            Выберите категорию
        </option>

        <option value="Электроника">
            📱 Электроника
        </option>

        <option value="Авто">
            🚗 Авто
        </option>

        <option value="Одежда">
            👕 Одежда
        </option>

        <option value="Дом">
            🏠 Дом
        </option>

        <option value="Игры">
            🎮 Игры
        </option>

        <option value="Другое">
            📦 Другое
        </option>

    </select>



    <input
        id="productCity"
        class="input-field"
        type="text"
        placeholder="Город"
    >



    <textarea
        id="productDescription"
        class="textarea-field"
        placeholder="Описание товара"
    ></textarea>



    <button
        class="publish-button"
        onclick="publishProduct()">

        🚀 Опубликовать объявление

    </button>


</div>



<script>


/* =========================
   ОТКРЫТЬ ПРОДАЖУ
========================= */

function openSellForm() {

    document.getElementById("mainScreen").style.display = "none";

    document.getElementById("sellForm").style.display = "block";

}



/* =========================
   ЗАКРЫТЬ ПРОДАЖУ
========================= */

function closeSellForm() {

    document.getElementById("sellForm").style.display = "none";

    document.getElementById("mainScreen").style.display = "block";

}



/* =========================
   ПУБЛИКАЦИЯ
========================= */

function publishProduct() {


    const name =
        document.getElementById("productName").value.trim();


    const price =
        document.getElementById("productPrice").value.trim();


    const category =
        document.getElementById("productCategory").value;


    const city =
        document.getElementById("productCity").value.trim();


    const description =
        document.getElementById("productDescription").value.trim();



    if (
        !name ||
        !price ||
        !category ||
        !city ||
        !description
    ) {

        alert("Пожалуйста, заполните все поля.");

        return;

    }



    alert(
        "Объявление создано!\n\n" +
        name + "\n" +
        price + " ₽\n" +
        category + "\n" +
        city
    );



    document.getElementById("productName").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productCategory").value = "";

    document.getElementById("productCity").value = "";

    document.getElementById("productDescription").value = "";


    closeSellForm();

}


</script>


</body>

</html>
