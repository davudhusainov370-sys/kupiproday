<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Купи Продай</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #202020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            background: #111111;
            padding: 28px 36px;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
        }

        .search {
            margin: 38px 36px;
            background: #3b3b3b;
            border-radius: 28px;
            padding: 25px 32px;
            color: #999;
            font-size: 24px;
        }

        .title {
            margin: 0 36px 28px;
            font-size: 40px;
            font-weight: 700;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            padding: 0 36px;
        }

        .category {
            background: #111111;
            border-radius: 30px;
            min-height: 138px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .sell-button {
            position: fixed;
            left: 36px;
            right: 36px;
            bottom: 35px;

            background: #111111;
            color: white;

            border: none;
            border-radius: 28px;

            padding: 28px;
            font-size: 30px;
            font-weight: 700;
        }

        .emoji {
            margin-right: 12px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            🛍️ Купи Продай
        </div>
    </div>

    <div class="search">
        🔍 Что хотите найти?
    </div>

    <div class="title">
        Категории
    </div>

    <div class="categories">

        <div class="category">
            <span class="emoji">📱</span>
            Электроника
        </div>

        <div class="category">
            <span class="emoji">🚗</span>
            Авто
        </div>

        <div class="category">
            <span class="emoji">👕</span>
            Одежда
        </div>

        <div class="category">
            <span class="emoji">🏠</span>
            Дом
        </div>

        <div class="category">
            <span class="emoji">🎮</span>
            Игры
        </div>

        <div class="category">
            <span class="emoji">📦</span>
            Другое
        </div>

    </div>

    <button class="sell-button">
        ＋&nbsp; Продать товар
    </button>

</body>
</html>
