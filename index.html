<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Купи Продай</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #202020;
            color: white;
            font-family: Arial, sans-serif;
        }


        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        #mainScreen {
            min-height: 100vh;
            padding-bottom: 100px;
        }


        /* ШАПКА */

        .header {
            background: #111111;
            padding: 24px 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }


        /* ПОИСК */

        .search {
            margin: 36px 20px;
            background: #3b3b3b;
            border-radius: 22px;
            padding: 20px;
            color: #999;
            font-size: 20px;
            white-space: nowrap;
            overflow: hidden;
        }


        /* ЗАГОЛОВОК */

        .title {
            margin: 0 20px 22px;
            font-size: 30px;
            font-weight: 700;
        }


        /* КАТЕГОРИИ */

        .categories {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 16px;

            padding: 0 20px;
        }


        .category {

            background: #111111;

            border-radius: 22px;

            height: 108px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 10px;

            font-size: 19px;

            min-width: 0;

            overflow: hidden;

            cursor: pointer;
        }


        .emoji {
            margin-right: 7px;
            flex-shrink: 0;
        }


        /* =========================
           КНОПКА ПРОДАТЬ
        ========================= */

        .sell-button {

            position: fixed;

            left: 20px;
            right: 20px;

            bottom: 20px;

            width: calc(100% - 40px);

            background: #111111;

            color: white;

            border: none;

            border-radius: 22px;

            padding: 19px;

            font-size: 22px;

            font-weight: 700;

            z-index: 100;

            cursor: pointer;
        }


        /* =========================
           ЭКРАН ПРОДАЖИ
        ========================= */

        #sellForm {

            display: none;

            position: fixed;

            inset: 0;

            background: #202020;

            z-index: 1000;

            overflow-y: auto;

            padding:
                20px
                20px
                40px;
        }


        /* ЗАГОЛОВОК ФОРМЫ */

        .sell-header {

            display: flex;

            align-items: center;

            margin-bottom: 25px;
        }


        .back-button {

            background: none;

            border: none;

            color: white;

            font-size: 36px;

            padding: 0 12px 0 0;

            cursor: pointer;
        }


        .sell-title {

            margin: 0;

            font-size: 27px;

            font-weight: 700;
        }


        /* =========================
           ФОТО
        ========================= */

        .photo-title {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        .photo-box {

            width: 100%;

            min-height: 150px;

            margin-bottom: 14px;

            background: #383838;

            border-radius: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            cursor: pointer;

            position: relative;
        }


        .photo-placeholder {

            color: #999;

            font-size: 17px;

            text-align: center;

            padding: 30px;
        }


        #photoPreview {

            width: 100%;

            max-height: 300px;

            object-fit: cover;

            display: none;
        }


        #productPhoto {

            display: none;
        }


        /* ПОЛЯ */

        .input-field,
        .select-field,
        .textarea-field {

            width: 100%;

            padding: 17px;

            margin-bottom: 14px;

            border: none;

            border-radius: 17px;

            background: #383838;

            color: white;

            font-size: 17px;

            outline: none;
        }


        .input-field::placeholder,
        .textarea-field::placeholder {

            color: #999;
        }


        .select-field {

            appearance: auto;
        }


        .textarea-field {

            height: 130px;

            resize: none;
        }


        /* ПУБЛИКАЦИЯ */

        .publish-button {

            width: 100%;

            padding: 18px;

            margin-top: 5px;

            border: none;

            border-radius: 19px;

            background: #111111;

            color: white;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;
        }

        #productsList {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.product-card {
    background: #ffffff;
    color: #222;
    border-radius: 20px;
    padding: 15px;
    width: 90%;
    max-width: 350px;
    margin: 0 auto;
    box-sizing: border-box;
}

.product-card img {
    width: 100% !important;
    height: 220px !important;
    object-fit: cover;
    border-radius: 15px;
}

.product-card h3 {
    margin-top: 15px;
    margin-bottom: 10px;
}

.product-card p {
    margin: 6px 0;
}


        /* ЭФФЕКТ НАЖАТИЯ */

        button:active,
        .category:active,
        .photo-box:active {

            transform: scale(0.98);
        }


        /* =========================
           МАЛЕНЬКИЕ ЭКРАНЫ
        ========================= */

        @media (max-width: 380px) {

            .header {
                padding: 20px 16px;
            }

            .logo {
                font-size: 25px;
            }

            .search {
                margin: 28px 16px;
                padding: 18px;
                font-size: 18px;
            }

            .title {
                margin-left: 16px;
                margin-right: 16px;
                font-size: 27px;
            }

            .categories {
                padding: 0 16px;
                gap: 12px;
            }

            .category {
                height: 95px;
                font-size: 16px;
                border-radius: 18px;
            }

            .sell-button {

                left: 16px;
                right: 16px;

                width: calc(100% - 32px);

                bottom: 15px;

                padding: 17px;

                font-size: 20px;

            }
        /* Карточки товаров */

#productsList {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 100px;
}

.product-card {
    background: #ffffff;
    color: #222;
    border-radius: 20px;
    padding: 15px;
    width: calc(100% - 32px);
    max-width: 350px;
    margin: 0 auto;
    box-sizing: border-box;
}

.product-card img {
    width: 100% !important;
    height: 220px !important;
    object-fit: cover;
    border-radius: 15px;
}

.product-card h3 {
    margin: 12px 0;
    font-size: 24px;
}

.product-card p {
    margin: 8px 0;
    font-size: 17px;
}
    </style>

</head>


<body>


<!-- =====================================
     ГЛАВНЫЙ ЭКРАН
===================================== -->

<div id="mainScreen">


    <div class="header">

        <div class="logo">
            🛍️ Купи Продай
        </div>
        
    </div>


    <div class="search">
        🔍&nbsp; Что хотите найти?
    </div>


    <div class="title">
        Категории
    </div>


    <div class="categories">


        <div class="category">
            <span class="emoji">📱</span>
            Электроника
        </div>


        <div class="category">
            <span class="emoji">🚗</span>
            Авто
        </div>


        <div class="category">
            <span class="emoji">👕</span>
            Одежда
        </div>


        <div class="category">
            <span class="emoji">🏠</span>
            Дом
        </div>


        <div class="category">
            <span class="emoji">🎮</span>
            Игры
        </div>


        <div class="category">
            <span class="emoji">📦</span>
            Другое
        </div>

<div id="productsList">
    
</div>
    </div>


    <button
        class="sell-button"
        onclick="openSellForm()">

        ＋ Продать товар

    </button>


</div>



<!-- =====================================
     ФОРМА ПРОДАЖИ
===================================== -->

<div id="sellForm">


    <div class="sell-header">

        <button
            class="back-button"
            onclick="closeSellForm()">

            ‹

        </button>


        <h2 class="sell-title">
            Продать товар
        </h2>

    </div>


    <!-- ФОТО -->

    <div class="photo-title">
        📷 Фотография товара
    </div>


    <label
        class="photo-box"
        for="productPhoto">

        <div
            id="photoPlaceholder"
            class="photo-placeholder">

            📷 Нажмите, чтобы добавить фото

        </div>


        <img
            id="photoPreview"
            alt="Фото товара">

    </label>


    <input
        id="productPhoto"
        type="file"
        accept="image/*"
        onchange="previewPhoto()"
    >


    <!-- НАЗВАНИЕ -->

    <input
        id="productName"
        class="input-field"
        type="text"
        placeholder="Название товара"
    >


    <!-- ЦЕНА -->

    <input
        id="productPrice"
        class="input-field"
        type="number"
        placeholder="Цена, ₽"
    >


    <!-- КАТЕГОРИЯ -->

    <select
        id="productCategory"
        class="select-field">

        <option value="">
            Выберите категорию
        </option>

        <option value="Электроника">
            📱 Электроника
        </option>

        <option value="Авто">
            🚗 Авто
        </option>

        <option value="Одежда">
            👕 Одежда
        </option>

        <option value="Дом">
            🏠 Дом
        </option>

        <option value="Игры">
            🎮 Игры
        </option>

        <option value="Другое">
            📦 Другое
        </option>

    </select>


    <!-- ГОРОД -->

    <input
        id="productCity"
        class="input-field"
        type="text"
        placeholder="Город"
    >


    <!-- ОПИСАНИЕ -->

    <textarea
        id="productDescription"
        class="textarea-field"
        placeholder="Описание товара"
    ></textarea>


    <!-- ПУБЛИКАЦИЯ -->

    <button
        class="publish-button"
        onclick="publishProduct()">

        🚀 Опубликовать объявление

    </button>


</div>



<script>


/* =========================
   ОТКРЫТЬ ПРОДАЖУ
========================= */

function openSellForm() {

    document.getElementById("mainScreen").style.display = "none";

    document.getElementById("sellForm").style.display = "block";

}



/* =========================
   ЗАКРЫТЬ ПРОДАЖУ
========================= */

function closeSellForm() {

    document.getElementById("sellForm").style.display = "none";

    document.getElementById("mainScreen").style.display = "block";

}



/* =========================
   ПРЕВЬЮ ФОТО
========================= */

function previewPhoto() {

    const input =
        document.getElementById("productPhoto");

    const preview =
        document.getElementById("photoPreview");

    const placeholder =
        document.getElementById("photoPlaceholder");


    if (input.files && input.files[0]) {

        const file = input.files[0];

        const imageURL =
            URL.createObjectURL(file);


        preview.src = imageURL;

        preview.style.display = "block";

        placeholder.style.display = "none";

    }

}



/* =========================
   ПУБЛИКАЦИЯ
========================= */

function publishProduct() {


    const photo =
        document.getElementById("productPhoto").files[0];


    const name =
        document.getElementById("productName").value.trim();


    const price =
        document.getElementById("productPrice").value.trim();


    const category =
        document.getElementById("productCategory").value;


    const city =
        document.getElementById("productCity").value.trim();


    const description =
        document.getElementById("productDescription").value.trim();



    /* ПРОВЕРКА ПОЛЕЙ */

    if (!photo) {

        alert("Пожалуйста, добавьте фотографию товара.");

        return;

    }


    if (
        !name ||
        !price ||
        !category ||
        !city ||
        !description
    ) {

        alert("Пожалуйста, заполните все поля.");

        return;

    }



    /* ВРЕМЕННАЯ ПУБЛИКАЦИЯ */

    alert(
        "Объявление создано! 🎉\n\n" +
        name + "\n" +
        price + " ₽\n" +
        category + "\n" +
        city
    );

const product = {
    name: name,
    price: price,
    category: category,
    city: city,
    description: description,
    photo: URL.createObjectURL(photo)
};

let products = JSON.parse(localStorage.getItem("products")) || [];

products.push(product);

localStorage.setItem("products", JSON.stringify(products));

showProducts();

    /* ОЧИСТКА ФОРМЫ */

    document.getElementById("productPhoto").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productCategory").value = "";

    document.getElementById("productCity").value = "";

    document.getElementById("productDescription").value = "";


    document.getElementById("photoPreview").src = "";

    document.getElementById("photoPreview").style.display = "none";

    document.getElementById("photoPlaceholder").style.display = "block";


    closeSellForm();

}
function showProducts() {

    const list = document.getElementById("productsList");

    if (!list) return;

    let products = JSON.parse(localStorage.getItem("products")) || [];

    list.innerHTML = "";

    products.forEach(product => {

        list.innerHTML += `
        <div class="product-card">

            <img src="${product.photo}" width="150">

            <h3>${product.name}</h3>

            <p>Цена: ${product.price} ₽</p>

            <p>Категория: ${product.category}</p>

            <p>Город: ${product.city}</p>

            <p>${product.description}</p>

        </div>
        `;

    });

}

</script>


</body>

</html>
